name: Release (Windows package)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (defaults to package.json)'
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package Windows x64 zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Packages out/**, resources/icon.* and the Windows runtime:
      #   dist/TodoLine-Electron-<version>-win-x64.zip
      - name: Package
        run: pnpm package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoLine-Electron-win-x64
          path: |
            dist/*.zip
            dist/release-*/**
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 portable build. Unzip and run `TodoLine Electron.exe`;
            no Node or Qt installation is required.
