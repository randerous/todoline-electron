name: Release (Windows package)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (defaults to package.json)'
        required: false

permissions:
  contents: write

jobs:
  package:
    name: Package Windows x64 zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The store lives inside the checkout (.npmrc store-dir), so setup-node's
      # pnpm cache cannot see it; cache it explicitly.
      - uses: actions/cache@v4
        with:
          path: .cache/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # gcc/g++ compile the Windows clipboard and image-decode helpers.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Packages out/**, resources/icon.* and the Windows runtime:
      #   dist/TodoLine-Electron-<version>-win-x64.zip
      - name: Package
        run: pnpm package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoLine-Electron-win-x64
          # Only the portable zip; the unpacked dist/release-*/ tree is 10x bigger
          # and is reproduced by every run.
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 portable build. Unzip and run `TodoLine Electron.exe`;
            no Node or Qt installation is required.
